---
layout: default
---
<article>
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.github %}<a href="{{ page.github }}">GitHub</a>{% endif %}
    {% if page.tags.size > 0 %}
      <ul class="tags">
        {% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}
      </ul>
    {% endif %}
  </header>
  {{ content }}
</article>
