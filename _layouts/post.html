---
layout: default
---
<article>
  <header>
    <h1>{{ page.title }}</h1>
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    {% if page.tags.size > 0 %}
      <ul class="tags">
        {% for tag in page.tags %}<li>{{ tag }}</li>{% endfor %}
      </ul>
    {% endif %}
  </header>
  {{ content }}
</article>
