# Reading stream. Reverse-chronological, one entry per item.
#
# type:   paper | book | bookmark | video
# date:   when I engaged with it, NOT publication date and not file ctime.
#         The stream is an activity stream; this is the field it sorts on.
# url:    optional — many books have no canonical one.
# note:   optional. Block literal `|`, never folded `>`: folded scalars reflow
#         and break on leading whitespace, which a generator will hit sooner
#         or later. Quote every title and author — a colon in a title
#         ("Ficciones: ...") silently breaks a bare scalar.

