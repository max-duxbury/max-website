title: Max Duxbury
description: Maths undergrad exploring ML, distributed systems, and stochastics.
url: "https://maxduxbury.com"
baseurl: ""

author:
  name: Max Duxbury
  email: "max.duxbury@outlook.com"
  github: "max-duxbury"
  linkedin: "max-duxbury"  # TODO: confirm — assumes linkedin.com/in/max-duxbury

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Blog
permalink: /blog/:year/:month/:day/:title/

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - vendor/
