title: Max Duxbury
description: Maths undergrad exploring ML, distributed systems, and stochastics.
url: "https://maxduxbury.com"
baseurl: ""

author:
  name: Max Duxbury
  email: "max.duxbury@outlook.com"
  github: "max-duxbury"
  linkedin: "maxwduxbury"

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Collections
collections:
  projects:
    output: true
    permalink: /projects/:name/

# Default front matter
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project

# Maths — rendered server-side at build. show_warnings is load-bearing:
# without it a missing/broken math engine leaves a GREEN build that renders
# literal $$...$$ on the page. The .kdmath CSS rule is the visual canary.
kramdown:
  math_engine: katex
  show_warnings: true

# Blog
permalink: /blog/:year/:month/:day/:title/

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - TODO.md
  - CLAUDE.md
  - vendor/
